name: Build Android APK

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902'
          packages: ''
      - name: Install Android SDK 37
        run: |
          android sdk install platform-tools
          android sdk install platforms/android-37.0
          android sdk install build-tools/37.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Build F-Droid release APK
        shell: bash
        run: |
          free -h
          df -h "$GITHUB_WORKSPACE"
          vmstat -w 30 &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT
          # Share Gradle's heap with Kotlin instead of starting another large JVM.
          ./gradlew :app:assembleFdroidScDefaultRelease --no-daemon --max-workers=2 \
            -Pkotlin.compiler.execution.strategy=in-process --stacktrace \
            -PmatriceVersionCode=$((1250 + GITHUB_RUN_NUMBER))
      - name: Build resource diagnostics
        if: always()
        run: |
          free -h
          df -h "$GITHUB_WORKSPACE"
          sudo dmesg --ctime | tail -n 80 || true
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/build/outputs/apk/fdroidScDefault/release/*.apk
          if-no-files-found: error
